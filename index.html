
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana özel ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #3b071d, #10000b 70%);
  color: white;
  font-family: Georgia, serif;
  text-align: center;
}

main {
  width: 100%;
  padding: 24px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: clamp(28px, 6vw, 48px);
  color: #ff9fbd;
  text-shadow: 0 0 20px #ff174f;
  margin-bottom: 10px;
}

#heart {
  color: #ff174f;
  font-size: clamp(70px, 16vw, 130px);
  line-height: 1.3;
  animation: beat 1s infinite;
  filter: drop-shadow(0 0 20px #ff174f);
}

#message {
  font-size: clamp(17px, 4vw, 24px);
  color: #ffe3ec;
  min-height: 60px;
  line-height: 1.5;
}

button {
  border: 1px solid #ff91b5;
  border-radius: 30px;
  background: #e91655;
  color: white;
  padding: 13px 24px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 12px;
}

button:hover { background: #ff3975; }

.heart {
  position: fixed;
  bottom: -30px;
  color: #ff719d;
  animation: rise linear forwards;
  pointer-events: none;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.13); }
}

@keyframes rise {
  to {
    transform: translateY(-110vh) rotate(25deg);
    opacity: 0;
  }
}
</style>
</head>
<body>
<main>
  <h1>Seni çok seviyorum ❤️</h1>
  <div id="heart">♥</div>
  <p id="message">Sen benim en güzel tesadüfümsün. 💗</p>
  <button onclick="showLove()">Kalbine dokun ❤️</button>
</main>

<script>
const messages = [
  "Seni çok seviyorum ❤️",
  "İyi ki hayatımdasın 💗",
  "Her gün yeniden seni seçerdim 💕",
  "Sen benim en güzel tesadüfümsün 🌹",
  "Mesafeler olsa bile kalbim seninle 💖"
];

let index = 0;

function showLove() {
  index = (index + 1) % messages.length;
  document.getElementById("message").textContent = messages[index];
  document.getElementById("heart").animate(
    [
      { transform: "scale(1)" },
      { transform: "scale(1.35)" },
      { transform: "scale(1)" }
    ],
    { duration: 500 }
  );
}

function createHeart() {
  const el = document.createElement("span");
  el.className = "heart";
  el.textContent = Math.random() > 0.5 ? "♥" : "♡";
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (14 + Math.random() * 24) + "px";
  el.style.animationDuration = (4 + Math.random() * 5) + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 9000);
}

setInterval(createHeart, 350);
</script>
</body>
</html>
